<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;
    -webkit-text-size-adjust:100%; /* stops iOS Safari from auto-boosting text size, which was hiding the marquee until manually changing text size */

  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }

  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;
  }

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){
    .site-header canvas{
      height:110px;
    }
  }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  .site-nav{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;
  }

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    align-items:center;
    height:100%;
    width:max-content;
    white-space:nowrap;
    will-change: transform;
  }

  .marquee-track span{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5efe6;
    padding:7px 0;
    flex-shrink:0;
  }

  .site-footer{
    width:100%;
    background:#6e1414;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:16px 24px;
  }

  .footer-star{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .footer-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .footer-nav a{
    color:#f5efe6;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .footer-nav a:hover,
  .footer-nav a:focus-visible{
    opacity:0.65;
  }

  .footer-social{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#f5efe6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .footer-social svg{
    width:15px;
    height:15px;
  }

  main{
    flex:1;
    width:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:210px 24px 60px;
  }

  .order-wrap{
    width:100%;
    max-width:480px;
    text-align:center;
  }

  h1{
    font-size:clamp(24px, 4vw, 34px);
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    line-height:1.2;
  }

  .order-wrap > p{
    margin-top:12px;
    font-size:14px;
    letter-spacing:0.1em;
    color:#9a8080;
  }

  form{
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:20px;
    text-align:left;
  }

  label{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#6e1414;
  }

  input, select, textarea{
    width:100%;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:16px;
    color:#111110;
    padding:10px 4px;
    border:none;
    border-bottom:1px solid #6e1414;
    background:transparent;
    outline:none;
  }

  input:focus, select:focus, textarea:focus{
    border-bottom-width:2px;
  }

  textarea{
    resize:vertical;
    min-height:100px;
  }

  .row{
    display:flex;
    gap:20px;
  }

  .row label{
    flex:1;
    min-width:0;
  }

  button{
    appearance:none;
    background:transparent;
    border:none;
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:18px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    padding:14px 0 6px;
    cursor:pointer;
    align-self:center;
    transition:opacity 0.3s ease;
  }

  button:hover,
  button:focus-visible{
    opacity:0.6;
  }

  @media (max-width: 480px){
    .row{
      flex-direction:column;
      gap:20px;
    }
  }
</style>

  <main>
    <div class="order-wrap">
      <h1>Order Now</h1>

      <!--
        REPLACE THE FORM ACTION BELOW with your real Formspree endpoint
        once you've created a form at formspree.io (e.g. https://formspree.io/f/xxxxxxxx)
      -->
      <form action="https://formspree.io/f/xkodrlvz" method="POST">
        <label>

        <label>

        </label>

        <label>
          Board Style
          <select name="style">
            <option value="">Select one</option>
            <option value="Jazzpunk">Jazzpunk</option>

        <div class="row">
          <label>
            Board Size
            <input type="text" name="length" placeholder="e.g. 5'10&quot;">

          <label>
            Width
            <input type="text" name="width" placeholder="e.g. 19&quot;">
          </label>
          <label>
            Thickness
            <input type="text" name="thickness" placeholder="e.g. 2.5&quot;">
          </label>
        </div>

        <label>
          Notes to the Shaper
          <textarea name="message"></textarea>
        </label>

        <button type="submit">Send Inquiry</button>
      </form>
    </div>
  </main>

  <script>
    (function(){
      var header = document.getElementById('siteHeader');
      var main = document.querySelector('main');

      function adjustSpacing(){
        main.style.paddingTop = (header.offsetHeight + 24) + 'px';
      }

      adjustSpacing();
      window.addEventListener('resize', adjustSpacing);
      window.addEventListener('load', adjustSpacing);
      setTimeout(adjustSpacing, 300); // re-measure once fonts/logo finish rendering
    })();
  </script>
  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function buildMarquee(){
        // measure exactly one copy of the phrase at the marquee's real font styling
        var measure = document.createElement('span');
        measure.style.visibility = 'hidden';
        measure.style.position = 'absolute';
        measure.style.whiteSpace = 'nowrap';
        measure.style.fontFamily = '"Times New Roman", Times, Georgia, serif';
        measure.style.fontSize = '12px';
        measure.style.letterSpacing = '0.14em';
        measure.style.textTransform = 'uppercase';
        measure.textContent = phrase;
        document.body.appendChild(measure);
        var phraseWidth = measure.getBoundingClientRect().width || 400;
        document.body.removeChild(measure);

        var repeats = Math.max(4, Math.ceil(window.innerWidth / phraseWidth) + 2);
        var repeated = phrase.repeat(repeats);
        track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
      }

      buildMarquee();
      window.addEventListener('resize', buildMarquee);

      if (reduceMotion) return; // respect the OS-level "reduce motion" accessibility setting

      // Drive the scroll with plain JS on every frame instead of a CSS animation.
      // CSS keyframe animations inside a position:fixed header were proving
      // unreliable on iOS Safari; updating transform directly via
      // requestAnimationFrame sidesteps that class of bug entirely.
      // start one full "page" to the left so there's always real content
      // to reveal as the track slides right (no blank gaps)
      var offset = -(track.scrollWidth / 2);
      var speedPxPerSec = 25; // lower = slower scroll
      var lastTime = null;

      function tick(timestamp){
        if (lastTime === null) lastTime = timestamp;
        var delta = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        offset += speedPxPerSec * delta; // increasing = moves left-to-right
        var halfWidth = track.scrollWidth / 2;
        if (halfWidth > 0 && offset >= 0){
          offset -= halfWidth;
        }
        track.style.transform = 'translateX(' + offset + 'px)';
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
