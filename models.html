<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Indulgence Design — Models</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;
    -webkit-text-size-adjust:100%; /* stops iOS Safari from auto-boosting text size, which was hiding the marquee until manually changing text size */
    text-size-adjust:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }

  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;
  }

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){
    .site-header canvas{
      height:110px;
    }
  }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  .site-nav{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;
  }

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    width:max-content;
    white-space:nowrap;
    animation: marquee-scroll 150s linear infinite;
    -webkit-animation: marquee-scroll 150s linear infinite;
    will-change: transform;
    -webkit-transform:translate3d(0,0,0); /* fixes iOS Safari not rendering CSS animations inside position:fixed ancestors until a repaint is forced */
    transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  .marquee-track span{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5efe6;
    padding:7px 0;
    flex-shrink:0;
  }

  @keyframes marquee-scroll{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-track{ animation:none; }
  }

  .site-footer{
    width:100%;
    background:#6e1414;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:16px 24px;
  }

  .footer-star{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .footer-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .footer-nav a{
    color:#f5efe6;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .footer-nav a:hover,
  .footer-nav a:focus-visible{
    opacity:0.65;
  }

  .footer-social{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#f5efe6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .footer-social svg{
    width:15px;
    height:15px;
  }

  main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:flex-start;
    padding:150px 0 60px 40px;
  }

  .models-layout{
    width:100%;
    display:flex;
    gap:56px;
    align-items:flex-start;
  }

  .model-list{
    flex-shrink:0;
    width:200px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .model-list button{
    appearance:none;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    text-align:left;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:17px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#9a8080;
    padding:12px 0;
    cursor:pointer;
    transition:color 0.3s ease, border-color 0.3s ease;
  }

  .model-list button:hover,
  .model-list button:focus-visible{
    color:#6e1414;
  }

  .model-list button.active{
    color:#6e1414;
    font-weight:700;
    border-bottom-color:#6e1414;
  }

  .model-content{
    flex:1;
    min-width:0;
    max-width:520px;
    text-align:left;
  }

  /* ---- single photo viewer with prev/next arrows ---- */
  .model-photo-viewer{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .photo-nav{
    appearance:none;
    background:transparent;
    border:none;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:34px;
    line-height:1;
    color:#6e1414;
    cursor:pointer;
    padding:0 4px;
    flex-shrink:0;
    transition:opacity 0.3s ease;
  }

  .photo-nav:hover,
  .photo-nav:focus-visible{
    opacity:0.6;
  }

  .photo-nav:disabled{
    opacity:0.2;
    cursor:default;
  }

  .model-photo-frame{
    flex:1;
    min-width:0;
    aspect-ratio:3/4;
    background:repeating-linear-gradient(115deg, #f7f0f0 0 2px, #efe4e4 2px 4px);
    border:1px solid #eee2e2;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    cursor:pointer;
  }

  .model-photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .model-photo-frame span{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9a8080;
    max-width:200px;
    line-height:1.6;
  }

  .model-title{
    margin-top:24px;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#6e1414;
  }

  .model-description{
    margin-top:12px;
    max-width:480px;
    font-size:15px;
    line-height:1.6;
    color:#111110;
  }

  /* ---- lightbox (click photo to view full screen) ---- */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.94);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
  }

  .lightbox[hidden]{
    display:none;
  }

  .lightbox img{
    max-width:88vw;
    max-height:82vh;
    display:block;
  }

  .lightbox-close,
  .lightbox-nav{
    position:fixed;
    appearance:none;
    background:transparent;
    border:none;
    color:#f5f0ee;
    cursor:pointer;
    font-family:"Times New Roman", Times, Georgia, serif;
    transition:opacity 0.3s ease;
  }

  .lightbox-close:hover,
  .lightbox-nav:hover{
    opacity:0.6;
  }

  .lightbox-close{
    top:20px;
    right:24px;
    font-size:32px;
  }

  .lightbox-nav{
    top:50%;
    transform:translateY(-50%);
    font-size:48px;
    padding:10px 16px;
  }

  .lightbox-prev{ left:8px; }
  .lightbox-next{ right:8px; }

  @media (max-width:480px){
    .lightbox-nav{ font-size:36px; padding:6px 10px; }
  }

  @media (max-width: 640px){
    main{
      padding-left:24px;
      padding-right:24px;
    }
    .models-layout{
      gap:20px;
    }
    .model-list{
      width:90px;
      flex-shrink:0;
    }
    .model-list button{
      font-size:14px;
      padding:8px 0;
    }
    .model-photo-frame{
      aspect-ratio:3/4;
    }
    .photo-nav{
      font-size:24px;
    }
  }
</style>
</head>
<body>

    <video id="logoVideo" class="visually-hidden-video" muted loop autoplay playsinline>
      <source src="header-logo-chroma.mp4" type="video/mp4">
    </video>
    <a href="site.html" class="logo-link" aria-label="Return to home page">
      <canvas id="logoCanvas" width="162" height="120"></canvas>
    </a>
    <nav class="site-nav">
      <a href="models.html">Models</a>
      <a href="videos.html">Videos</a>
      <a href="archive.html">Archive</a>
      <a href="order.html">Order</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="marquee">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
  </header>

  <main>
    <div class="models-layout">
      <div class="model-list" id="modelList"></div>
      <div class="model-content">
        <div class="model-photo-viewer">
          <button class="photo-nav photo-prev" id="modelPhotoPrev" aria-label="Previous photo">&#8249;</button>
          <div class="model-photo-frame" id="modelPhotoFrame"></div>
          <button class="photo-nav photo-next" id="modelPhotoNext" aria-label="Next photo">&#8250;</button>
        </div>
        <div class="model-title" id="modelTitle"></div>
        <div class="model-description" id="modelDescription"></div>
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
    <img id="lightboxImg" src="" alt="Enlarged board photo">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
    /*
      MODELS
      ----------------------------------------------------
      Each model can have any number of photos (an empty array shows
      a placeholder slot instead). Add more photo paths as you get them.
    */
    var MODELS = [
      {
        name: "Jazzpunk",
        photos: ["models/jazzpunk-1.jpg"],
        description: "Officially calling this board the Jazzpunk. A winged swallow tail twin fin that includes a single concave out the tail, allowing more speed and control than a classic twin fin but still very loose and free feeling under the feet."
      },
      {
        name: "PunkStyleLove",
        photos: ["models/punkstylelove-1.jpg", "models/punkstylelove-2.jpg"],
        description: "Typically ridden between 6'2 and 6'7, this board comes as a quad or twinzer."
      },
      {
        name: "Sidfishious",
        photos: ["models/sidfishious-1.jpg", "models/sidfishious-2.jpg"],
        description: "Classic fish."
      }
    ];

    (function(){
      var list = document.getElementById('modelList');
      var frame = document.getElementById('modelPhotoFrame');
      var prevBtn = document.getElementById('modelPhotoPrev');
      var nextBtn = document.getElementById('modelPhotoNext');
      var titleEl = document.getElementById('modelTitle');
      var descEl = document.getElementById('modelDescription');
      var buttons = [];

      var modelIndex = 0;
      var photoIndex = 0;

      function currentPhotos(){
        var model = MODELS[modelIndex];
        return (model.photos && model.photos.length) ? model.photos : [null];
      }

      function renderPhoto(){
        var photos = currentPhotos();
        var src = photos[photoIndex];

        frame.innerHTML = '';
        if (src){
          var img = document.createElement('img');
          img.src = src;
          img.alt = MODELS[modelIndex].name;
          frame.appendChild(img);
        } else {
          var span = document.createElement('span');
          span.textContent = 'Photo coming soon';
          frame.appendChild(span);
        }

        var multiple = photos.length > 1;
        prevBtn.disabled = !multiple;
        nextBtn.disabled = !multiple;
      }

      function showModel(index){
        modelIndex = index;
        photoIndex = 0;
        var model = MODELS[modelIndex];

        buttons.forEach(function(btn, i){
          btn.classList.toggle('active', i === index);
        });

        titleEl.textContent = model.name;
        descEl.textContent = model.description;
        renderPhoto();
      }

      function stepPhoto(step){
        var photos = currentPhotos();
        if (photos.length <= 1) return;
        photoIndex = (photoIndex + step + photos.length) % photos.length;
        renderPhoto();
      }

      MODELS.forEach(function(model, i){
        var btn = document.createElement('button');
        btn.textContent = model.name;
        btn.addEventListener('click', function(){ showModel(i); });
        list.appendChild(btn);
        buttons.push(btn);
      });

      prevBtn.addEventListener('click', function(){ stepPhoto(-1); });
      nextBtn.addEventListener('click', function(){ stepPhoto(1); });

      // ---- fullscreen lightbox ----
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightboxImg');

      function openLightbox(){
        var photos = currentPhotos();
        if (!photos[photoIndex]) return; // nothing to enlarge for a placeholder slot
        lightboxImg.src = photos[photoIndex];
        lightbox.hidden = false;
      }

      function closeLightbox(){
        lightbox.hidden = true;
        lightboxImg.src = '';
      }

      function lightboxStep(step){
        stepPhoto(step);
        var photos = currentPhotos();
        if (photos[photoIndex]) lightboxImg.src = photos[photoIndex];
      }

      frame.addEventListener('click', openLightbox);
      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      document.getElementById('lightboxPrev').addEventListener('click', function(){ lightboxStep(-1); });
      document.getElementById('lightboxNext').addEventListener('click', function(){ lightboxStep(1); });

      lightbox.addEventListener('click', function(e){
        if (e.target === lightbox){ closeLightbox(); }
      });

      document.addEventListener('keydown', function(e){
        if (lightbox.hidden) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lightboxStep(-1);
        if (e.key === 'ArrowRight') lightboxStep(1);
      });

      showModel(0);
    })();
  </script>
  <script>
    (function(){
      var header = document.getElementById('siteHeader');
      var main = document.querySelector('main');

      function adjustSpacing(){
        main.style.paddingTop = (header.offsetHeight + 24) + 'px';
      }

      adjustSpacing();
      window.addEventListener('resize', adjustSpacing);
      window.addEventListener('load', adjustSpacing);
      setTimeout(adjustSpacing, 300); // re-measure once fonts/logo finish rendering
    })();
  </script>
  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var repeated = phrase.repeat(20);
      track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
  <footer class="site-footer">
    <svg class="footer-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="50.00,8.00 40.57,37.02 10.06,37.02 34.74,54.96 25.31,83.98 50.00,66.04 74.69,83.98 65.26,54.96 89.94,37.02 59.43,37.02" fill="#f5efe6"/>
    </svg>

        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#6e1414" stroke-width="2"/>
          <circle cx="12" cy="12" r="5" fill="none" stroke="#6e1414" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.3" fill="#6e1414"/>
        </svg>
      </a>
    </nav>
  </footer>
</body>
