<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Indulgence Design — Models</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }

  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;
  }

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){
    .site-header canvas{
      height:110px;
    }
  }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  .site-nav{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;
  }

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    width:max-content;
    white-space:nowrap;
    animation: marquee-scroll 150s linear infinite;
    -webkit-animation: marquee-scroll 150s linear infinite;
    will-change: transform;
    -webkit-transform:translate3d(0,0,0); /* fixes iOS Safari not rendering CSS animations inside position:fixed ancestors until a repaint is forced */
    transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  .marquee-track span{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5efe6;
    padding:7px 0;
    flex-shrink:0;
  }

  @keyframes marquee-scroll{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-track{ animation:none; }
  }

  main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    padding:150px 24px 60px;
  }

  .models-layout{
    width:100%;
    max-width:1000px;
    display:flex;
    gap:56px;
    align-items:flex-start;
  }

  .model-list{
    flex-shrink:0;
    width:200px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .model-list button{
    appearance:none;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    text-align:left;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:17px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#9a8080;
    padding:12px 0;
    cursor:pointer;
    transition:color 0.3s ease, border-color 0.3s ease;
  }

  .model-list button:hover,
  .model-list button:focus-visible{
    color:#6e1414;
  }

  .model-list button.active{
    color:#6e1414;
    font-weight:700;
    border-bottom-color:#6e1414;
  }

  .model-content{
    flex:1;
    min-width:0;
    text-align:left;
  }

  .model-photo{
    width:100%;
    max-width:520px;
    aspect-ratio:4/3;
    background:repeating-linear-gradient(115deg, #f7f0f0 0 2px, #efe4e4 2px 4px);
    border:1px solid #eee2e2;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .model-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .model-photo span{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9a8080;
    max-width:220px;
    line-height:1.6;
  }

  .model-title{
    margin-top:24px;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#6e1414;
  }

  .model-description{
    margin-top:12px;
    max-width:480px;
    font-size:15px;
    line-height:1.6;
    color:#111110;
  }

  @media (max-width: 640px){
    .models-layout{
      flex-direction:column;
      gap:28px;
    }
    .model-list{
      width:100%;
      flex-direction:row;
      flex-wrap:wrap;
      gap:0 20px;
    }
    .model-list button{
      padding:8px 0;
    }
  }
</style>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <video id="logoVideo" class="visually-hidden-video" muted loop autoplay playsinline>
      <source src="header-logo-chroma.mp4" type="video/mp4">
    </video>
    <a href="site.html" class="logo-link" aria-label="Return to home page">
      <canvas id="logoCanvas" width="162" height="120"></canvas>
    </a>
    <nav class="site-nav">
      <a href="models.html">Models</a>
      <a href="videos.html">Videos</a>
      <a href="archive.html">Archive</a>
      <a href="order.html">Order</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="marquee">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
  </header>

  <main>
    <div class="models-layout">
      <div class="model-list" id="modelList"></div>
      <div class="model-content">
        <div class="model-photo" id="modelPhoto"></div>
        <div class="model-title" id="modelTitle"></div>
        <div class="model-description" id="modelDescription"></div>
      </div>
    </div>
  </main>

  <script>
    /*
      MODELS
      ----------------------------------------------------
      Add photos and real descriptions here as you have them.
      photo: path to an image (e.g. "models/jazzpunk.jpg"), or null to
      show a placeholder until you have one.
      description: a paragraph about the board — dimensions, feel,
      what conditions it's built for, etc.
    */
    var MODELS = [
      {
        name: "Jazzpunk",
        photo: null,
        description: "Add a description for the Jazzpunk here — dimensions, riding style, and what it's built for."
      },
      {
        name: "PunkStyleLove",
        photo: null,
        description: "Add a description for the PunkStyleLove here — dimensions, riding style, and what it's built for."
      },
      {
        name: "Sidfishious",
        photo: null,
        description: "Add a description for the Sidfishious here — dimensions, riding style, and what it's built for."
      }
    ];

    (function(){
      var list = document.getElementById('modelList');
      var photoEl = document.getElementById('modelPhoto');
      var titleEl = document.getElementById('modelTitle');
      var descEl = document.getElementById('modelDescription');
      var buttons = [];

      function showModel(index){
        var model = MODELS[index];

        buttons.forEach(function(btn, i){
          btn.classList.toggle('active', i === index);
        });

        titleEl.textContent = model.name;
        descEl.textContent = model.description;

        if (model.photo){
          photoEl.innerHTML = '<img src="' + model.photo + '" alt="' + model.name + '">';
        } else {
          photoEl.innerHTML = '<span>Photo coming soon for ' + model.name + '</span>';
        }
      }

      MODELS.forEach(function(model, i){
        var btn = document.createElement('button');
        btn.textContent = model.name;
        btn.addEventListener('click', function(){ showModel(i); });
        list.appendChild(btn);
        buttons.push(btn);
      });

      showModel(0);
    })();
  </script>
  <script>
    (function(){
      var header = document.getElementById('siteHeader');
      var main = document.querySelector('main');

      function adjustSpacing(){
        main.style.paddingTop = (header.offsetHeight + 24) + 'px';
      }

      adjustSpacing();
      window.addEventListener('resize', adjustSpacing);
      window.addEventListener('load', adjustSpacing);
      setTimeout(adjustSpacing, 300); // re-measure once fonts/logo finish rendering
    })();
  </script>
  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var repeated = phrase.repeat(20);
      track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
</html>
