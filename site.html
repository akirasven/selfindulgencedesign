<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Indulgence Design</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;
    -webkit-text-size-adjust:100%; /* stops iOS Safari from auto-boosting text size, which was hiding the marquee until manually changing text size */
    text-size-adjust:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }

  /* ---- fixed header ---- */
  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;
  }

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){
    .site-header canvas{
      height:110px;
    }
    main{
      align-items:center;
    }
  }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  .site-nav{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;
  }

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    width:max-content;
    white-space:nowrap;
    animation: marquee-scroll 150s linear infinite;
    -webkit-animation: marquee-scroll 150s linear infinite;
    will-change: transform;
    -webkit-transform:translate3d(0,0,0); /* fixes iOS Safari not rendering CSS animations inside position:fixed ancestors until a repaint is forced */
    transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  .marquee-track span{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5efe6;
    padding:7px 0;
    flex-shrink:0;
  }

  @keyframes marquee-scroll{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-track{ animation:none; }
  }

  .site-footer{
    width:100%;
    background:#6e1414;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:16px 24px;
  }

  .footer-star{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .footer-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .footer-nav a{
    color:#f5efe6;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .footer-nav a:hover,
  .footer-nav a:focus-visible{
    opacity:0.65;
  }

  .footer-social{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#f5efe6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .footer-social svg{
    width:15px;
    height:15px;
  }

  /* ---- main content, pushed down below the fixed header ---- */
  main{
    flex:1;
    width:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    text-align:center;
    padding:24px 24px 24px; /* top padding is set dynamically by JS to match the actual header height */
  }

  .definition{
    font-size:15px;
    font-style:italic;
    font-weight:700;
    line-height:1.5;
    color:#6e1414;
    max-width:520px;
    margin:16px auto 32px;
  }

  .definition a{
    color:#6e1414;
  }

  h1{
    font-size:clamp(28px, 5vw, 48px);
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    line-height:1.2;
  }
  p{
    margin-top:16px;
    font-size:20px;
    font-style:italic;
    font-weight:700;
    letter-spacing:0.04em;
    color:#6e1414;
  }

  .yt-frame{
    margin:32px auto 0;
    width:min(92vw, 720px);
    aspect-ratio:16/9;
  }

  .yt-frame iframe{
    width:100%;
    height:100%;
    border:0;
  }
</style>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <video id="logoVideo" class="visually-hidden-video" muted loop autoplay playsinline>
      <source src="header-logo-chroma.mp4" type="video/mp4">
    </video>
    <a href="site.html" class="logo-link" aria-label="Return to home page">
      <canvas id="logoCanvas" width="162" height="120"></canvas>
    </a>
    <nav class="site-nav">
      <a href="models.html">Models</a>
      <a href="videos.html">Videos</a>
      <a href="archive.html">Archive</a>
      <a href="order.html">Order</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="marquee">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
  </header>

  <main>
    <div>
      <h1>Self Indulgence Design</h1>
      <div class="definition">
        <div>excessive or unrestrained gratification of one's own appetites, desires, or whims</div>
        <div>self-indulgent. self-in-ˈdəl-jənt. adjective. self-indulgently</div>
      </div>
      <p>Pretty On The Inside</p>
      <div class="yt-frame">
        <iframe
          src="https://www.youtube-nocookie.com/embed/IZ3QvrsQHTo"
          title="Self Indulgence Design"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </main>

  <script>
    (function(){
      var header = document.getElementById('siteHeader');
      var main = document.querySelector('main');

      function adjustSpacing(){
        main.style.paddingTop = (header.offsetHeight + 24) + 'px';
      }

      adjustSpacing();
      window.addEventListener('resize', adjustSpacing);
      window.addEventListener('load', adjustSpacing);
      // header height can change slightly once fonts/logo finish rendering
      setTimeout(adjustSpacing, 300);
    })();
  </script>

  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var repeated = phrase.repeat(20);
      track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            // key out the green background, keep everything else opaque
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
  <footer class="site-footer">
    <svg class="footer-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="50.00,8.00 40.57,37.02 10.06,37.02 34.74,54.96 25.31,83.98 50.00,66.04 74.69,83.98 65.26,54.96 89.94,37.02 59.43,37.02" fill="#f5efe6"/>
    </svg>
    <nav class="footer-nav">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/selfindulgencedesign?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" class="footer-social" aria-label="Instagram">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#6e1414" stroke-width="2"/>
          <circle cx="12" cy="12" r="5" fill="none" stroke="#6e1414" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.3" fill="#6e1414"/>
        </svg>
      </a>
    </nav>
  </footer>
</body>
</html>
