<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;

  }
  body{

    flex-direction:column;
    align-items:center;
    min-height:100%;

  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){

      height:110px;
    }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;

  .site-nav{
    width:100%;

    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    align-items:center;
    height:100%;
    width:max-content;
    white-space:nowrap;
    will-change: transform;
  }

  .marquee-track span{

    letter-spacing:0.14em;
    text-transform:uppercase;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;
    padding:16px 24px;

  .footer-star{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .footer-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .footer-nav a{
    color:#f5efe6;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;

  main{

  }

  .gallery{
    width:100%;
    max-width:1300px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
    padding-bottom:80px;
  }

  @media (min-width: 640px){

  @media (min-width: 1000px){
    .gallery{

  .gallery figure{
    width:100%;

  }

  .gallery img{

  /* ---- back to top button ---- */

    position:fixed;
    right:20px;
    bottom:20px;
    width:40px;
    height:40px;

    opacity:0;

  .back-to-top:hover,

  /* ---- lightbox ---- */

    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.94);

    align-items:center;

    <img id="lightboxImg" src="" alt="Self Indulgence Design archive photo, enlarged">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>

  <script>
    /*
      ARCHIVE PHOTOS
      ----------------------------------------------------
      All archive photos now live in Firestore, managed from
      admin.html — this list stays empty on purpose so nothing shows
      twice. It's still here as a safety net: if you ever want a few
      guaranteed-to-render photos even when Firestore is unreachable,
      add entries here in the same { src, aspect } shape as before.
    */
    var FALLBACK_PHOTOS = [];

    var archivePage = (function(){
      var PHOTOS = FALLBACK_PHOTOS;
      var gallery = document.getElementById('gallery');

      function renderGallery(){
        gallery.innerHTML = '';
        PHOTOS.forEach(function(photo, i){
          var figure = document.createElement('figure');

          if (photo.src){
            var img = document.createElement('img');
            img.src = photo.src;
            img.alt = 'Self Indulgence Design archive photo';
            img.loading = 'lazy';
            img.dataset.photoIndex = i; // index into PHOTOS, used by the lightbox
            img.addEventListener('click', function(){
              openLightbox(i);
            });
            figure.appendChild(img);
          } else {
            var div = document.createElement('div');
            div.className = 'placeholder-photo ' + photo.aspect;
            var span = document.createElement('span');
            span.textContent = 'Photo placeholder — add real images to the PHOTOS list';
            div.appendChild(span);
            figure.appendChild(div);
          }

          gallery.appendChild(figure);
        });
      }

      // ---- lightbox ----
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightboxImg');
      var currentIndex = 0;

      function openLightbox(index){
        currentIndex = index;
        lightboxImg.src = PHOTOS[currentIndex].src;
        lightbox.hidden = false;
      }

      function closeLightbox(){
        lightbox.hidden = true;
        lightboxImg.src = '';
      }

      function showPhoto(step){
        // loop through the PHOTOS list in either direction
        currentIndex = (currentIndex + step + PHOTOS.length) % PHOTOS.length;
        lightboxImg.src = PHOTOS[currentIndex].src;
      }

      // ---- swipe support (mobile) ----
      function addSwipe(el, onSwipeLeft, onSwipeRight){
        var startX = 0, startY = 0, tracking = false;
        el.addEventListener('touchstart', function(e){
          if (e.touches.length !== 1) return;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          tracking = true;
        }, { passive: true });
        el.addEventListener('touchend', function(e){
          if (!tracking) return;
          tracking = false;
          var touch = e.changedTouches[0];
          var dx = touch.clientX - startX;
          var dy = touch.clientY - startY;
          var SWIPE_THRESHOLD = 40;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD){
            if (dx < 0) onSwipeLeft(); else onSwipeRight();
          }
        }, { passive: true });
      }

      addSwipe(lightbox, function(){ showPhoto(1); }, function(){ showPhoto(-1); });

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      document.getElementById('lightboxPrev').addEventListener('click', function(){ showPhoto(-1); });
      document.getElementById('lightboxNext').addEventListener('click', function(){ showPhoto(1); });

      lightbox.addEventListener('click', function(e){
        if (e.target === lightbox){ closeLightbox(); }
      });

      document.addEventListener('keydown', function(e){
        if (lightbox.hidden) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showPhoto(-1);
        if (e.key === 'ArrowRight') showPhoto(1);
      });

      // ---- back to top ----
      var backToTop = document.getElementById('backToTop');

      window.addEventListener('scroll', function(){
        if (window.scrollY > 400){
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
      });

      backToTop.addEventListener('click', function(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      renderGallery();

      return {
        // Called from the module script below if — and only if —
        // Firestore is reachable and has archive photos in it. Keeps
        // the original hardcoded photos and adds the new ones after
        // them, rather than replacing them.
        setPhotos: function(newPhotos){
          if (!newPhotos || !newPhotos.length) return;
          PHOTOS = FALLBACK_PHOTOS.concat(newPhotos);
          renderGallery();
        }
      };
    })();
  </script>
  <script type="module">
    // Tries to upgrade the page to live Firestore data. If this script
    // fails to load or run for any reason (offline, ad blocker, Firebase
    // not fully set up yet), the page above still works fine on its own.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    var app = initializeApp(firebaseConfig);
    var db = getFirestore(app);
    var q = query(collection(db, 'archivePhotos'), orderBy('order', 'asc'));

    getDocs(q).then(function(snap){
      var loaded = [];
      snap.forEach(function(docSnap){ loaded.push(docSnap.data()); });
      archivePage.setPhotos(loaded);
    }).catch(function(err){
      console.warn('Showing sample archive photos — could not load from Firestore:', err);
    });
  </script>

  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function buildMarquee(){
        // measure exactly one copy of the phrase at the marquee's real font styling
        var measure = document.createElement('span');
        measure.style.visibility = 'hidden';
        measure.style.position = 'absolute';
        measure.style.whiteSpace = 'nowrap';
        measure.style.fontFamily = '"Times New Roman", Times, Georgia, serif';
        measure.style.fontSize = '12px';
        measure.style.letterSpacing = '0.14em';
        measure.style.textTransform = 'uppercase';
        measure.textContent = phrase;
        document.body.appendChild(measure);
        var phraseWidth = measure.getBoundingClientRect().width || 400;
        document.body.removeChild(measure);

        var repeats = Math.max(4, Math.ceil(window.innerWidth / phraseWidth) + 2);
        var repeated = phrase.repeat(repeats);
        track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
      }

      buildMarquee();
      window.addEventListener('resize', buildMarquee);

      if (reduceMotion) return; // respect the OS-level "reduce motion" accessibility setting

      // Drive the scroll with plain JS on every frame instead of a CSS animation.
      // CSS keyframe animations inside a position:fixed header were proving
      // unreliable on iOS Safari; updating transform directly via
      // requestAnimationFrame sidesteps that class of bug entirely.
      // start one full "page" to the left so there's always real content
      // to reveal as the track slides right (no blank gaps)
      var offset = -(track.scrollWidth / 2);
      var speedPxPerSec = 25; // lower = slower scroll
      var lastTime = null;

      function tick(timestamp){
        if (lastTime === null) lastTime = timestamp;
        var delta = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        offset += speedPxPerSec * delta; // increasing = moves left-to-right
        var halfWidth = track.scrollWidth / 2;
        if (halfWidth > 0 && offset >= 0){
          offset -= halfWidth;
        }
        track.style.transform = 'translateX(' + offset + 'px)';
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
