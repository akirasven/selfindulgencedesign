<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow-x:hidden;
    background:#ffffff;
    color:#6e1414;
    font-family: "Times New Roman", Times, Georgia, serif;
    cursor: url('cursor-star.png') 16 16, auto;
    -webkit-text-size-adjust:100%; /* stops iOS Safari from auto-boosting text size, which was hiding the marquee until manually changing text size */

  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;

  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    width:100%;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 0;
    background:#ffffff;
    z-index:10;
    border-bottom:1px solid #eee2e2;
  }

  .site-header canvas{
    height:56px;
    width:auto;
    display:block;
  }

  @media (min-width: 768px){
    .site-header canvas{
      height:110px;
    }
  }

  .logo-link{
    display:block;
    line-height:0;
    text-decoration:none;
  }

  .visually-hidden-video{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  .site-nav{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-evenly;
    padding:10px 24px;
  }

  .site-nav a{
    color:#6e1414;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible{
    opacity:0.6;
  }

  .marquee{
    width:100%;
    overflow:hidden;
    background:#6e1414;
    border-top:1px solid rgba(255,255,255,0.15);
    white-space:nowrap;
    -webkit-transform:translateZ(0); /* forces iOS Safari to paint this layer immediately */
    transform:translateZ(0);
  }

  .marquee-track{
    display:flex;
    align-items:center;
    height:100%;
    width:max-content;
    white-space:nowrap;
    will-change: transform;
  }

  .marquee-track span{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#f5efe6;
    padding:7px 0;
    flex-shrink:0;
  }

  .site-footer{
    width:100%;
    background:#6e1414;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:16px 24px;
  }

  .footer-star{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .footer-nav{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .footer-nav a{
    color:#f5efe6;
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    transition:opacity 0.3s ease;
  }

  .footer-nav a:hover,
  .footer-nav a:focus-visible{
    opacity:0.65;
  }

  .footer-social{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#f5efe6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .footer-social svg{
    width:15px;
    height:15px;
  }

  main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 24px 100px;
  }

  .video-list{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:100px;
  }

  .video-block{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .video-title{
    font-size:clamp(18px, 3vw, 24px);
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#6e1414;
  }

  .video-year{
    margin-top:6px;
    font-size:13px;
    letter-spacing:0.16em;
    color:#9a8080;
  }

  .yt-frame{
    margin-top:22px;
    width:100%;
    aspect-ratio:16/9;
  }

  .yt-frame iframe{
    width:100%;
    height:100%;
    border:0;
  }

  .video-placeholder{
    margin-top:22px;
    width:100%;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:repeating-linear-gradient(115deg, #f7f0f0 0 2px, #efe4e4 2px 4px);

  .video-placeholder span{

    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9a8080;
    max-width:240px;
    line-height:1.6;
  }

      <div class="marquee-track" id="marqueeTrack"></div>

  <main>
    <div class="video-list" id="videoList"></div>
  </main>

  <script>
    /*
      VIDEOS
      ----------------------------------------------------
      Add or reorder entries here. Each needs a title, a year, and a
      YouTube video ID (the part after "v=" or after "youtu.be/" in a
      YouTube link). Leave videoId as null to show a placeholder instead.
    */
    var VIDEOS = [
      { title: "Pretty On The Inside", year: "2025", videoId: "IZ3QvrsQHTo" },
      { title: "PunkStyleLove", year: "2026", videoId: "n1Lzcj-j9qo" }
    ];

    (function(){
      var list = document.getElementById('videoList');

      VIDEOS.forEach(function(video){
        var block = document.createElement('div');
        block.className = 'video-block';

        var title = document.createElement('div');
        title.className = 'video-title';
        title.textContent = video.title;

        var year = document.createElement('div');
        year.className = 'video-year';
        year.textContent = video.year;

        block.appendChild(title);
        block.appendChild(year);

        if (video.videoId){
          var frame = document.createElement('div');
          frame.className = 'yt-frame';
          frame.innerHTML =
            '<iframe src="https://www.youtube-nocookie.com/embed/' + video.videoId +
            '" title="' + video.title + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
          block.appendChild(frame);
        } else {
          var placeholder = document.createElement('div');
          placeholder.className = 'video-placeholder';
          placeholder.innerHTML = '<span>Add a YouTube video ID to fill this in</span>';
          block.appendChild(placeholder);
        }

        list.appendChild(block);
      });
    })();
  </script>
  <script>
    (function(){
      var header = document.getElementById('siteHeader');
      var main = document.querySelector('main');

      function adjustSpacing(){
        main.style.paddingTop = (header.offsetHeight + 24) + 'px';
      }

      adjustSpacing();
      window.addEventListener('resize', adjustSpacing);
      window.addEventListener('load', adjustSpacing);
      setTimeout(adjustSpacing, 300); // re-measure once fonts/logo finish rendering
    })();
  </script>
  <script>
    (function(){
      var track = document.getElementById('marqueeTrack');
      var phrase = "SELF INDULGENCE  *  THE INDUSTRY'S BEST KEPT SECRET  *  ";
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function buildMarquee(){
        // measure exactly one copy of the phrase at the marquee's real font styling
        var measure = document.createElement('span');
        measure.style.visibility = 'hidden';
        measure.style.position = 'absolute';
        measure.style.whiteSpace = 'nowrap';
        measure.style.fontFamily = '"Times New Roman", Times, Georgia, serif';
        measure.style.fontSize = '12px';
        measure.style.letterSpacing = '0.14em';
        measure.style.textTransform = 'uppercase';
        measure.textContent = phrase;
        document.body.appendChild(measure);
        var phraseWidth = measure.getBoundingClientRect().width || 400;
        document.body.removeChild(measure);

        var repeats = Math.max(4, Math.ceil(window.innerWidth / phraseWidth) + 2);
        var repeated = phrase.repeat(repeats);
        track.innerHTML = '<span>' + repeated + '</span><span>' + repeated + '</span>';
      }

      buildMarquee();
      window.addEventListener('resize', buildMarquee);

      if (reduceMotion) return; // respect the OS-level "reduce motion" accessibility setting

      // Drive the scroll with plain JS on every frame instead of a CSS animation.
      // CSS keyframe animations inside a position:fixed header were proving
      // unreliable on iOS Safari; updating transform directly via
      // requestAnimationFrame sidesteps that class of bug entirely.
      // start one full "page" to the left so there's always real content
      // to reveal as the track slides right (no blank gaps)
      var offset = -(track.scrollWidth / 2);
      var speedPxPerSec = 25; // lower = slower scroll
      var lastTime = null;

      function tick(timestamp){
        if (lastTime === null) lastTime = timestamp;
        var delta = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        offset += speedPxPerSec * delta; // increasing = moves left-to-right
        var halfWidth = track.scrollWidth / 2;
        if (halfWidth > 0 && offset >= 0){
          offset -= halfWidth;
        }
        track.style.transform = 'translateX(' + offset + 'px)';
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    (function(){
      var video = document.getElementById('logoVideo');
      var canvas = document.getElementById('logoCanvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      function drawFrame(){
        if (!video.paused && !video.ended){
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var data = frame.data;
          for (var i = 0; i < data.length; i += 4){
            var r = data[i], g = data[i+1], b = data[i+2];
            if (g > 85 && g > r * 1.3 && g > b * 1.3){
              data[i+3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        }
        requestAnimationFrame(drawFrame);
      }

      video.play().catch(function(){});
      requestAnimationFrame(drawFrame);
    })();
  </script>
